name: Samsung SM8250 Kernel Build SUSFS (v4 Clean)

on:
  workflow_dispatch:
    inputs:
      Option:
        description: 'ksun, twrp, stock'
        required: true
        type: choice
        options: [ksun, twrp, stock]

jobs:
  build:
    strategy:
      matrix:
        # Nhắc lại: Test 1 máy cho chắc rồi hãy để cả dàn matrix
        device: [z3q] 
    runs-on: ubuntu-24.04

    steps:
    # 1. Nâng cấp checkout lên v4 (Sửa lỗi Node.js 20)
    - name: "Checkout source code"
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: "Set up build environment"
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make bc bison flex libssl-dev libelf-dev clang lld gcc-aarch64-linux-gnu git curl wget jq p7zip-full

    # 2. Fix lỗi thiếu Kconfig của KernelSU mà log nãy báo
    - name: "Fix KernelSU Kconfig"
      run: |
        mkdir -p drivers/kernelsu
        if [ ! -f drivers/kernelsu/Kconfig ]; then
          echo 'config KERNELSU' > drivers/kernelsu/Kconfig
          echo '    bool "KernelSU support"' >> drivers/kernelsu/Kconfig
          echo '    default y' >> drivers/kernelsu/Kconfig
        fi
        if [ ! -f drivers/kernelsu/Makefile ]; then
          echo 'obj-y += kernelsu/' > drivers/kernelsu/Makefile
        fi

    - name: "Add SusFS Module"
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs4ksu
        cp -r susfs4ksu/ksu_module_susfs drivers/ || true

    - name: "Fix Script Paths and Permissions"
      run: |
        # Xóa đường dẫn cứng của lão raystef66
        sed -i 's|/home/raystef66/kernel/||g' build.sh
        # Cấp quyền cho build script và cả toolchain (vì fork về có thể mất quyền execute)
        chmod +x build.sh
        find prebuilts -name "clang" -exec chmod +x {} + || true

    - name: "Build Kernel"
      run: |
        export KBUILD_BUILD_USER="Duy"
        export KBUILD_BUILD_HOST="GitHub"
        # Chạy build. Nếu fail sẽ liệt kê file để ông soi lỗi tiếp
        ./build.sh ${{ matrix.device }} ${{ github.event.inputs.Option }} || (ls -R && exit 1)

    # 3. Nâng cấp upload lên v4 (Sửa lỗi Node.js 20)
    - name: "Upload Artifacts (GitHub)"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Result-${{ matrix.device }}
        path: |
          *.zip
          *.tar
          out/arch/arm64/boot/Image*
          prebuilts/output/*

    - name: "Upload to GoFile (Anonymous)"
      if: always()
      run: |
        FINAL_FILE=$(find . -maxdepth 3 -name "*.zip" -o -name "*.tar" | head -n 1)
        if [ -f "$FINAL_FILE" ]; then
          RESPONSE=$(curl -F "file=@$FINAL_FILE" "https://upload-eu-par.gofile.io/uploadFile")
          DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          echo "Link tai: $DOWNLOAD_LINK"
        else
          echo "Build fail, no file to upload."
        fi
